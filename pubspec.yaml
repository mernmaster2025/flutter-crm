name: flutter_crm
description: Premium mobile CRM application built with Flutter, Riverpod, GoRouter, Dio, Hive, and Material 3.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.20.1
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/mock/
